<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watermarker</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: #102033; background: #e8eef5 url("{{ url_for('static', filename='background.png') }}") center/cover fixed; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
    .card { background: rgba(255,255,255,.94); border-radius: 18px; box-shadow: 0 18px 50px rgba(16,32,51,.18); padding: 32px; }
    .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .brand img { width: 64px; height: 64px; object-fit: contain; }
    h1 { margin: 0; font-size: 2rem; }
    form { display: grid; gap: 18px; }
    input[type=file] { padding: 18px; border: 2px dashed #7b8da8; border-radius: 12px; background: #f8fbff; }
    button, .button { border: 0; border-radius: 10px; background: #1769e0; color: white; padding: 12px 18px; font-weight: 700; text-decoration: none; cursor: pointer; display: inline-block; }
    .error { color: #9b1c1c; background: #ffe8e8; border-radius: 10px; padding: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 28px; }
    .result { border: 1px solid #d8e0ec; border-radius: 12px; padding: 12px; background: white; }
    .result img { width: 100%; height: 180px; object-fit: contain; background: #f3f6fb; border-radius: 8px; }
    .actions { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Watermarker logo">
        <div>
          <h1>Watermarker</h1>
          <p>Upload images, preview watermarked results, and download individual files or a ZIP.</p>
        </div>
      </div>

      {% if error %}<p class="error">{{ error }}</p>{% endif %}

      <form method="post" action="{{ url_for('main.upload') }}" enctype="multipart/form-data">
        <label for="images"><strong>Choose images</strong></label>
        <input id="images" name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple required>
        <button type="submit">Apply watermark</button>
      </form>

      {% if images %}
        <div class="actions">
          <a class="button" href="{{ zip_url }}">Download ZIP</a>
        </div>
        <div class="grid">
          {% for image in images %}
            <article class="result">
              <img src="{{ image.preview_url }}" alt="Preview of {{ image.name }}">
              <p>{{ image.name }}</p>
              <a class="button" href="{{ image.download_url }}?download=1">Download image</a>
            </article>
          {% endfor %}
        </div>
      {% endif %}
    </section>
  </main>
</body>
</html>
